<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Visitor stats · Quran Recital</title>
<style>
  :root { --gold:#ffcf4d; --ink:#9fb9c2; --ctrl:#0e2d37; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:radial-gradient(130% 80% at 50% 12%,#11343f,#0b2630 45%,#061319); background-attachment:fixed;
    color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:28px 20px 60px; }
  * { scrollbar-width:thin; scrollbar-color:#1c4a57 #081d24; }
  ::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:#081d24}
  ::-webkit-scrollbar-thumb{background:#1c4a57;border-radius:7px;border:2px solid #081d24}
  .wrap { max-width:960px; margin:0 auto; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:22px; }
  .top a { color:var(--ink); text-decoration:none; font-size:14px; } .top a:hover{ color:var(--gold); }
  h1 { font-size:20px; letter-spacing:1px; text-transform:uppercase; color:var(--ink); font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
  .card { background:var(--ctrl); border:1px solid rgba(255,207,77,.2); border-radius:12px; padding:16px 18px; }
  .card .n { font-size:30px; font-weight:700; color:var(--gold); } .card .l { font-size:12px; color:var(--ink); text-transform:uppercase; letter-spacing:1px; margin-top:4px; }
  section { margin-bottom:28px; }
  h2 { font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--ink); margin-bottom:10px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:120px; padding:6px; background:#081d24; border-radius:10px; overflow-x:auto; }
  .bars .b { flex:0 0 auto; width:9px; background:#1c4a57; border-radius:2px 2px 0 0; min-height:2px; }
  .bars .b:hover { background:var(--gold); }
  .rows { display:grid; gap:5px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; background:var(--ctrl); border-radius:8px; padding:7px 12px; font-size:14px; }
  .row .bar { height:6px; background:#1c4a57; border-radius:3px; }
  .row .k { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .row .v { color:var(--gold); font-variant-numeric:tabular-nums; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.07); white-space:nowrap; }
  th { color:var(--ink); font-weight:600; }
  .muted { color:#6d868f; }
  .err { color:#ff8a8a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Visitor Statistics</h1>
    <a href="./">← back to recital</a>
  </div>
  <div id="out"><p class="muted">Loading…</p></div>
</div>
<script>
const API = 'https://qr-counter.ivosetyadi.workers.dev';
const flag = (cc) => (cc && cc.length===2 && /^[A-Z]{2}$/.test(cc)) ? cc.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))) : '🏳️';
const esc = (s) => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = (n) => Number(n||0).toLocaleString();
const when = (ts) => { const d=new Date(ts); return d.toISOString().slice(5,16).replace('T',' '); };

function barList(rows, labelFn) {
  const max = Math.max(1, ...rows.map(r=>r.n));
  return `<div class="rows">${rows.map(r=>`
    <div class="row"><span class="k">${labelFn(r)}</span><span class="v">${fmt(r.n)}</span>
      <div class="bar" style="grid-column:1/3;width:${Math.max(4,r.n/max*100)}%"></div></div>`).join('')}</div>`;
}

(async () => {
  const out = document.getElementById('out');
  try {
    const d = await (await fetch(`${API}/stats`)).json();
    const dayMax = Math.max(1, ...d.byDay.map(x=>x.n));
    const days = [...d.byDay].reverse();
    out.innerHTML = `
      <div class="cards">
        <div class="card"><div class="n">${fmt(d.total)}</div><div class="l">Total visits</div></div>
        <div class="card"><div class="n">${fmt(d.today)}</div><div class="l">Today</div></div>
        <div class="card"><div class="n">${fmt(d.byCountry.length)}</div><div class="l">Countries</div></div>
        <div class="card"><div class="n">${fmt(days.length)}</div><div class="l">Active days</div></div>
      </div>
      <section>
        <h2>Visits per day (last ${days.length})</h2>
        <div class="bars">${days.map(x=>`<div class="b" title="${x.day}: ${x.n}" style="height:${x.n/dayMax*100}%"></div>`).join('')}</div>
      </section>
      <div class="grid2">
        <section><h2>Top countries</h2>${barList(d.byCountry, r=>`${flag(r.k)} ${esc(r.k)}`)}</section>
        <section><h2>Referrers</h2>${barList(d.byRef, r=>esc(r.k).slice(0,46))}</section>
        <section><h2>Devices</h2>${barList(d.byDevice, r=>esc(r.k))}</section>
        <section><h2>Browsers</h2>${barList(d.byBrowser, r=>esc(r.k))}</section>
        <section><h2>Languages</h2>${barList(d.byLang, r=>esc(r.k))}</section>
      </div>
      <section>
        <h2>Recent visits</h2>
        <div style="overflow-x:auto"><table>
          <tr><th>when (UTC)</th><th>country</th><th>device</th><th>browser</th><th>page</th><th>referrer</th></tr>
          ${d.recent.map(r=>`<tr><td>${when(r.ts)}</td><td>${flag(r.country)} ${esc(r.country)}</td><td>${esc(r.device)}</td><td>${esc(r.browser)}</td><td class="muted">${esc(r.path)}</td><td class="muted">${esc((r.referrer||'(direct)')).slice(0,40)}</td></tr>`).join('')}
        </table></div>
      </section>
      <p class="muted" style="font-size:12px;margin-top:20px">Privacy: only country/city (from Cloudflare edge), device, browser & referrer are stored — no raw IP addresses.</p>`;
  } catch (e) {
    out.innerHTML = `<p class="err">Failed to load stats: ${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
