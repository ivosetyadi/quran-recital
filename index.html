<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quran Recital — Slow Step | Word-by-Word Highlight</title>
  <meta name="description" content="Listen to the Quran recited slowly with word-by-word highlighting: Arabic, transliteration, and English in sync. A tool for learning and memorization." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" id="stage">
    <div class="topbar">
      <div class="brand">Quran Recital · Slow Step</div>
      <div class="picker">
        <input id="surahSearch" class="surah-search" list="surahList" placeholder="Surah…" aria-label="Choose surah" autocomplete="off" />
        <datalist id="surahList"></datalist>
      </div>
    </div>
    <p class="tagline">Recited <strong>slowly</strong>, word by word — Arabic, transliteration &amp; meaning in sync. For beginners &amp; memorization.</p>
    <div class="opts">
      <label class="chk"><input type="checkbox" id="extraToggle" /> extra translation</label>
      <select id="extraLang" class="mode" aria-label="Extra translation language" disabled></select>
      <label class="chk"><input type="checkbox" id="tajToggle" /> tajweed colors</label>
    </div>
    <div class="legend" id="tajLegend" hidden></div>

    <div class="header" id="header">
      <div class="header-ar" id="headerAr"></div>
      <div class="header-en" id="headerEn"></div>
    </div>

    <div class="verse" id="verse" dir="rtl"></div>

    <div class="credit" id="credit"></div>
  </main>

  <div class="controls">
    <button id="prevBtn" title="Previous ayah" aria-label="Previous">⏮</button>
    <button id="playBtn" class="play" title="Play / Pause" aria-label="Play">▶</button>
    <button id="nextBtn" title="Next ayah" aria-label="Next">⏭</button>
    <span class="ayah-indicator" id="ayahIndicator">–</span>
    <select id="playMode" class="mode" aria-label="Playback mode">
      <option value="advance" selected>Continuous</option>
      <option value="repeat-ayah">Repeat ayah</option>
      <option value="repeat-surah">Repeat surah</option>
      <option value="stop">Stop after ayah</option>
    </select>
    <select id="speedSelect" class="speed" aria-label="Speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
    </select>
  </div>

  <div id="loading" class="loading" hidden><span>Loading…</span></div>
  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
