<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interlinear PoC — Quran Recital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{--gold:#ffcf4d;--cream:#ffe9b0;--arp:#cfe3e8;--arf:#5a7684;--trp:#c3d0d4;--trf:#536c76;--enp:#aebfc6;--enf:#56707b;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(130% 80% at 50% 12%,#11343f,#0b2630 45%,#061319);background-attachment:fixed;color:#fff;font-family:system-ui,sans-serif;padding:20px 16px 130px}
    .wrap{max-width:900px;margin:0 auto}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
    .brand{font-size:13px;letter-spacing:1px;color:#9fb9c2;text-transform:uppercase}
    .note{font-size:12px;color:#8fa8b1;text-align:center;margin-bottom:22px}
    select{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,207,77,.25);border-radius:8px;padding:7px 10px}
    select option{background:#0b2630;color:#fff}
    .head{text-align:center;margin:6px 0 26px}
    .head .ar{font-family:'Amiri',serif;font-weight:700;font-size:clamp(22px,5vw,34px);color:var(--gold);direction:rtl}
    .head .en{font-size:13px;letter-spacing:2px;color:#9fb9c2;text-transform:uppercase;margin-top:6px}

    /* INTERLINEAR: each word = a column (Arabic / translit / meaning), flows RTL, wraps */
    .verse{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;align-items:flex-start;gap:20px 16px;padding:0 6px}
    .w{display:flex;flex-direction:column;align-items:center;gap:5px;max-width:180px}
    .w .ar{font-family:'Amiri Quran',serif;font-size:clamp(30px,7vw,54px);line-height:1.5;color:var(--arf);transition:color .1s}
    .w .tr{direction:ltr;font-style:italic;font-size:clamp(12px,2.6vw,17px);color:var(--trf);transition:color .1s}
    .w .en{direction:ltr;font-size:clamp(11px,2.4vw,15px);color:var(--enf);text-align:center;line-height:1.3;transition:color .1s}
    .w.past .ar{color:var(--arp)} .w.past .tr{color:var(--trp)} .w.past .en{color:var(--enp)}
    .w.active .ar{color:var(--gold);text-shadow:0 0 26px rgba(255,207,77,.55)}
    .w.active .tr{color:var(--cream);font-weight:600}
    .w.active .en{color:var(--gold);font-weight:700}

    .credit{text-align:center;font-size:12px;color:rgba(255,255,255,.4);margin-top:26px}
    .controls{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;background:linear-gradient(to top,#061319 60%,transparent);flex-wrap:wrap}
    .controls button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,207,77,.25);border-radius:50%;width:48px;height:48px;font-size:18px;cursor:pointer}
    .controls button.play{width:58px;height:58px;font-size:24px;background:rgba(255,207,77,.18)}
    .ind{font-size:14px;color:#9fb9c2;min-width:52px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">Interlinear PoC</div>
      <select id="surahSel"></select>
    </div>
    <div class="note">Each Arabic word with its transliteration &amp; meaning directly beneath — flows and wraps per line (good for long ayat).</div>
    <div class="head"><div class="ar" id="hAr"></div><div class="en" id="hEn"></div></div>
    <div class="verse" id="verse"></div>
    <div class="credit" id="credit"></div>
  </div>
  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play" class="play">▶</button>
    <button id="next">⏭</button>
    <span class="ind" id="ind">–</span>
    <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
  </div>
  <audio id="audio" preload="auto"></audio>

  <script>
  const $=id=>document.getElementById(id);
  const pad3=n=>String(n).padStart(3,'0');
  const AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const toAr=n=>String(n).split('').map(d=>AR[+d]??d).join('');
  const audio=$('audio');
  let data=null,idx=0,raf=null,urls=[],ci=0,wantPlay=false;

  function urlsFor(ay){return [`https://cdn.islamic.network/quran/audio/64/ar.husary/${ay.global}.mp3`,...(data.audioCdns||[]).map(b=>b+ay.audio)];}
  function setAudio(ay){urls=urlsFor(ay);ci=0;audio.src=urls[0];audio.playbackRate=parseFloat($('speed').value);}
  audio.addEventListener('error',()=>{if(ci<urls.length-1){ci++;const at=audio.currentTime||0;audio.src=urls[ci];audio.load();audio.currentTime=at;if(wantPlay)audio.play().catch(()=>{});}});

  function render(){
    const ay=data.ayat[idx],c=data.chapter;
    $('hAr').textContent=`${toAr(c.id)} · ${c.name_arabic} · آية ${toAr(ay.ayah)}`;
    $('hEn').textContent=`${c.id} · ${c.name_simple} · Verse ${ay.ayah}`;
    $('ind').textContent=`${ay.ayah}/${c.verses_count}`;
    const v=$('verse');v.innerHTML='';
    ay.words.forEach(w=>{
      const u=document.createElement('div');u.className='w';
      u.innerHTML=`<div class="ar">${w.ar}</div><div class="tr">${w.tr}</div><div class="en">${w.en}</div>`;
      u.addEventListener('click',()=>{if(w.start!=null){audio.currentTime=w.start/1000;play();}});
      v.appendChild(u);
    });
    setAudio(ay);paint(0);
  }
  function st(w,ms){if(w.start==null)return'future';if(ms>=w.end)return'past';if(ms>=w.start)return'active';return'future';}
  function paint(ms){const ws=data.ayat[idx].words,els=$('verse').children;for(let i=0;i<ws.length;i++){const s=st(ws[i],ms),e=els[i];if(e.dataset.s!==s){e.classList.remove('past','active');if(s!=='future')e.classList.add(s);e.dataset.s=s;}}}
  function tick(){paint(audio.currentTime*1000);raf=requestAnimationFrame(tick);}
  function play(){wantPlay=true;audio.play().catch(()=>{});$('play').textContent='⏸';cancelAnimationFrame(raf);tick();}
  function pause(){wantPlay=false;audio.pause();$('play').textContent='▶';cancelAnimationFrame(raf);}
  function go(i,ap){if(i<0||i>=data.ayat.length)return;idx=i;render();ap?play():pause();}

  async function openSurah(id,ayah){
    data=await(await fetch(`data/${pad3(id)}.json`)).json();
    $('credit').textContent='Recited by '+data.reciter;$('surahSel').value=id;
    idx=ayah?Math.max(0,data.ayat.findIndex(a=>a.ayah===ayah)):0;render();
  }
  async function init(){
    const man=await(await fetch('data/manifest.json')).json();
    man.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=`${s.id}. ${s.name}`;$('surahSel').appendChild(o);});
    $('surahSel').addEventListener('change',e=>openSurah(+e.target.value));
    $('play').addEventListener('click',()=>audio.paused?play():pause());
    $('prev').addEventListener('click',()=>go(idx-1,wantPlay));
    $('next').addEventListener('click',()=>go(idx+1,wantPlay));
    $('speed').addEventListener('change',()=>audio.playbackRate=parseFloat($('speed').value));
    audio.addEventListener('ended',()=>{pause();if(idx<data.ayat.length-1)go(idx+1,true);});
    await openSurah(2,282); // default: longest ayah, to show interlinear handling
  }
  document.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
