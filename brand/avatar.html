<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@700&display=swap" rel="stylesheet"></head>
<body>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#15434f"/>
      <stop offset="55%" stop-color="#0b2630"/>
      <stop offset="100%" stop-color="#061319"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b0"/>
      <stop offset="45%" stop-color="#ffcf4d"/>
      <stop offset="100%" stop-color="#e0a93a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="400" cy="400" r="400" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="372" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.9"/>
  <circle cx="400" cy="400" r="352" fill="none" stroke="#ffcf4d" stroke-width="2" opacity="0.25"/>

  <!-- open Mushaf (book) -->
  <g transform="translate(400,430)">
    <!-- spine shadow -->
    <path d="M0,-120 L0,110" stroke="#0a2028" stroke-width="10" opacity="0.6"/>
    <!-- left page -->
    <path d="M-10,-118 C-120,-150 -230,-132 -300,-96 L-300,100 C-230,66 -120,52 -10,86 Z"
          fill="url(#gold)" opacity="0.92"/>
    <!-- right page -->
    <path d="M10,-118 C120,-150 230,-132 300,-96 L300,100 C230,66 120,52 10,86 Z"
          fill="url(#gold)"/>
    <!-- page text lines (left) -->
    <g stroke="#0b2630" stroke-width="12" stroke-linecap="round" opacity="0.55">
      <line x1="-60" y1="-70" x2="-250" y2="-110"/>
      <line x1="-60" y1="-30" x2="-250" y2="-70"/>
      <line x1="-60" y1="10"  x2="-250" y2="-30"/>
      <line x1="-60" y1="50"  x2="-250" y2="10"/>
    </g>
    <!-- page text lines (right) + one HIGHLIGHTED line -->
    <g stroke="#0b2630" stroke-width="12" stroke-linecap="round" opacity="0.55">
      <line x1="60" y1="-70" x2="250" y2="-110"/>
      <line x1="60" y1="10"  x2="250" y2="-30"/>
      <line x1="60" y1="50"  x2="250" y2="10"/>
    </g>
    <!-- highlighted word line (brighter + glow) -->
    <line x1="60" y1="-30" x2="250" y2="-70" stroke="#fff6da" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- crescent above -->
  <g transform="translate(400,150)" filter="url(#glow)">
    <path d="M0,-52 A52,52 0 1 0 0,52 A40,40 0 1 1 0,-52 Z" fill="url(#gold)"/>
  </g>
</svg>
</body></html>
