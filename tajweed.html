<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tajweed Colors + Play — PoC | Quran Recital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --grey:#9aa7ad; --silent:#6b7a80;
      --madd2:#f0a35e; --madd45:#f2b84b; --madd-ob:#ff5d5d; --madd6:#e53935;
      --ghunnah:#49c46d; --ikhfa:#2bb3c0; --qalqalah:#4a9df0; --iqlab:#b08be0;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(130% 80% at 50% 12%,#11343f,#0b2630 45%,#061319);background-attachment:fixed;color:#fff;font-family:system-ui,sans-serif;padding:20px 16px 150px}
    .wrap{max-width:900px;margin:0 auto}
    .brand{font-size:13px;letter-spacing:1px;color:#9fb9c2;text-transform:uppercase;text-align:center}
    .note{font-size:12px;color:#8fa8b1;text-align:center;margin:6px 0 16px}
    .nav{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .nav input{width:60px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,207,77,.25);border-radius:8px;padding:6px;text-align:center}
    .nav button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,207,77,.25);border-radius:8px;padding:6px 12px;cursor:pointer}
    .head{text-align:center;color:#9fb9c2;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}

    .verse{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;align-items:flex-start;gap:16px 10px;padding:8px}
    .w{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:220px;padding:8px 10px;border-radius:12px;cursor:pointer;transition:background .12s,box-shadow .12s}
    .w.active{background:rgba(255,207,77,.13);box-shadow:0 0 0 2px rgba(255,207,77,.4),0 0 22px rgba(255,207,77,.22)}
    .w .ar{font-family:'Amiri Quran',serif;font-size:clamp(32px,8vw,56px);line-height:1.7;color:#eaf2f4}
    .w .tr{direction:ltr;font-style:italic;font-size:clamp(13px,2.8vw,17px);color:#9fb9c2}
    .w .en{direction:ltr;font-size:clamp(12px,2.5vw,15px);text-align:center;line-height:1.3;color:#7d939b}
    .w.active .tr{color:#ffe9b0} .w.active .en{color:#cdd9dd}

    /* tajweed rule colors (per-word uses <rule>, per-verse uses <tajweed>) */
    .ar rule.ham_wasl, .ar rule.laam_shamsiyah, .ar rule.idgham_wo_ghunnah{color:var(--grey)}
    .ar rule.slnt{color:var(--silent)}
    .ar rule.madda_normal{color:var(--madd2)}
    .ar rule.madda_permissible{color:var(--madd45)}
    .ar rule.madda_obligatory{color:var(--madd-ob)}
    .ar rule.madda_necessary{color:var(--madd6)}
    .ar rule.ghunnah, .ar rule.idgham_ghunnah{color:var(--ghunnah)}
    .ar rule.ikhafa, .ar rule.ikhafa_shafawi{color:var(--ikhfa)}
    .ar rule.qalqalah{color:var(--qalqalah)}
    .ar rule.iqlab, .ar rule.idgham_shafawi, .ar rule.idgham_mutajanisayn, .ar rule.idgham_mutaqaribayn{color:var(--iqlab)}

    .legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:18px;font-size:13px;color:#cdd9dd}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

    .controls{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;background:linear-gradient(to top,#061319 60%,transparent);flex-wrap:wrap}
    .controls button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,207,77,.25);border-radius:50%;width:48px;height:48px;font-size:18px;cursor:pointer}
    .controls button.play{width:58px;height:58px;font-size:24px;background:rgba(255,207,77,.18)}
    .controls select{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,207,77,.25);border-radius:8px;padding:6px}
    .controls select option{background:#0b2630}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Quran Recital · Tajweed Colors + Play (PoC)</div>
    <div class="note">Letters coloured by tajweed rule; the recited word is boxed (colours stay visible). Data: Quran.com.</div>
    <div class="nav">
      <button id="prevA">◀</button>
      Surah <input id="s" type="number" min="1" max="114" value="2" />
      Ayah <input id="a" type="number" min="1" value="255" />
      <button id="go">Go</button>
      <button id="nextA">▶</button>
    </div>
    <div class="head" id="head"></div>
    <div class="verse" id="verse">…</div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="controls">
    <button id="play" class="play">▶</button>
    <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
  </div>
  <audio id="audio" preload="auto"></audio>

  <script>
    const el = (id) => document.getElementById(id);
    const audio = el('audio');
    const pad3 = (n) => String(n).padStart(3, '0');
    const COUNTS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
    const globalBase = (s) => COUNTS.slice(0, s - 1).reduce((x, y) => x + y, 0);

    const LEGEND = [
      ['Ghunnah / Idgham', 'var(--ghunnah)'], ['Ikhfa', 'var(--ikhfa)'],
      ['Qalqalah', 'var(--qalqalah)'], ['Iqlab / Idgham Shafawi', 'var(--iqlab)'],
      ['Madd 2', 'var(--madd2)'], ['Madd 4-5', 'var(--madd45)'],
      ['Madd obligatory', 'var(--madd-ob)'], ['Madd 6', 'var(--madd6)'],
      ['Silent / Hamzat wasl / Lam shamsiyyah', 'var(--grey)'],
    ];
    el('legend').innerHTML = LEGEND.map(([t, c]) => `<span><i class="dot" style="background:${c}"></i>${t}</span>`).join('');

    let words = [], raf = null, urls = [], ci = 0, want = false, count = 286;

    function urlsFor(s, a) {
      const g = globalBase(s) + a;
      return [`https://cdn.islamic.network/quran/audio/64/ar.husary/${g}.mp3`,
              `https://everyayah.com/data/Husary_64kbps/${pad3(s)}${pad3(a)}.mp3`];
    }
    function tryNext() { if (ci < urls.length - 1) { ci++; audio.src = urls[ci]; audio.load(); if (want) audio.play().catch(() => {}); } }
    audio.addEventListener('error', tryNext);

    async function load(s, a) {
      s = Math.min(114, Math.max(1, s)); a = Math.max(1, a);
      pause(); el('verse').textContent = '…';
      const ch = (await (await fetch(`https://api.quran.com/api/v4/chapters/${s}?language=en`)).json()).chapter;
      count = ch.verses_count; if (a > count) a = count;
      const key = `${s}:${a}`;
      const vd = await (await fetch(`https://api.quran.com/api/v4/verses/by_key/${key}?words=true&translations=131&word_fields=text_uthmani_tajweed`)).json();
      const sd = await (await fetch(`https://api.quran.com/api/v4/recitations/6/by_ayah/${key}?fields=segments`)).json();
      const segs = (sd.audio_files[0].segments || []).filter((x) => Array.isArray(x) && x.length === 4 && x.every((n) => typeof n === 'number'));
      const byWord = {}; segs.forEach(([, wno, st, en]) => byWord[wno] = { start: st, end: en });
      words = vd.verse.words.filter((w) => w.char_type_name === 'word').map((w) => ({
        taj: w.text_uthmani_tajweed || w.text_uthmani, tr: w.transliteration?.text || '', en: w.translation?.text || '',
        start: byWord[w.position]?.start ?? null, end: byWord[w.position]?.end ?? null,
      }));
      el('head').textContent = `${ch.id} · ${ch.name_simple} · Verse ${a}`;
      el('s').value = s; el('a').value = a;
      const v = el('verse'); v.innerHTML = '';
      words.forEach((w, i) => {
        const u = document.createElement('div'); u.className = 'w';
        u.innerHTML = `<div class="ar">${w.taj}</div><div class="tr">${w.tr}</div><div class="en">${w.en}</div>`;
        u.addEventListener('click', () => { if (w.start != null) { audio.currentTime = w.start / 1000; play(); } });
        v.appendChild(u);
      });
      ci = 0; urls = urlsFor(s, a); audio.src = urls[0]; audio.playbackRate = parseFloat(el('speed').value);
      history.replaceState(null, '', `#/${s}/${a}`);
      paint(0);
    }

    function paint(ms) {
      const u = el('verse').children;
      for (let i = 0; i < words.length; i++) {
        const w = words[i], on = w.start != null && ms >= w.start && ms < w.end;
        if (u[i].classList.contains('active') !== on) u[i].classList.toggle('active', on);
      }
    }
    function tick() { paint(audio.currentTime * 1000); raf = requestAnimationFrame(tick); }
    function play() { want = true; el('play').textContent = '⏸'; cancelAnimationFrame(raf); tick(); audio.play().catch((e) => { if (e && e.name === 'NotAllowedError') { want = false; el('play').textContent = '▶'; cancelAnimationFrame(raf); } else tryNext(); }); }
    function pause() { want = false; audio.pause(); el('play').textContent = '▶'; cancelAnimationFrame(raf); }

    el('play').onclick = () => audio.paused ? play() : pause();
    el('speed').onchange = () => audio.playbackRate = parseFloat(el('speed').value);
    el('go').onclick = () => load(+el('s').value || 1, +el('a').value || 1);
    el('nextA').onclick = () => { let s = +el('s').value, a = +el('a').value + 1; if (a > count) { s++; a = 1; } load(s, a); };
    el('prevA').onclick = () => { let s = +el('s').value, a = +el('a').value - 1; if (a < 1) { s = Math.max(1, s - 1); a = 1; } load(s, a); };
    audio.addEventListener('ended', () => { pause(); let s = +el('s').value, a = +el('a').value + 1; if (a <= count) load(s, a); });

    const m = location.hash.match(/#\/(\d+)\/(\d+)/);
    load(m ? +m[1] : 2, m ? +m[2] : 255);
  </script>
</body>
</html>
